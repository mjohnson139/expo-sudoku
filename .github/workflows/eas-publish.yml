# .github/workflows/eas-publish.yml
name: EAS Publish & Web Deploy

on:
  push:
    branches:
      - main
      # Epic branches are long-lived integration branches. They get their own
      # EAS Update branch so in-progress work is openable in Expo Go between
      # step PRs -- once a step PR merges into the epic there is no open PR
      # left, so the PR-preview job below would otherwise leave nothing to test.
      - 'epic/**'
  # `closed` is not in the default set of pull_request activity types, and the
  # cleanup job at the bottom needs it. The other three are the default types,
  # respelled here because naming any type replaces the defaults.
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write        # for gh-pages push
  pages: write           # for new Pages deployment engine
  id-token: write        # required by actions/deploy-pages
  pull-requests: write   # for the PR preview comment

# Cancel superseded runs for the same branch / PR
concurrency:
  group: eas-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20       # Expo SDK 54 requires Node 20+
  APP_DIR: ./SudokuApp

jobs:
# --------------------------------------------------------------------------
# Merge to main -> publish the production EAS Update
  publish-mobile:
    name: Publish EAS Update (main)
    # Pinned to main explicitly: this job hardcodes `--branch main`, so it must
    # never run for the epic pushes added to the trigger above -- that would
    # publish in-progress work onto the production update branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install
        working-directory: ${{ env.APP_DIR }}

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Publish to EAS Update for all platforms
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas update --branch main \
            --message "Auto-publish from main (${GITHUB_SHA::7})" \
            --platform all \
            --environment production \
            --non-interactive
        working-directory: ${{ env.APP_DIR }}

# --------------------------------------------------------------------------
# Push to an epic branch -> publish an EAS Update branch of the same name, so
# the epic is always openable in Expo Go (project -> Branches) even when no
# step PR is open.
  publish-epic:
    name: Publish EAS Update (epic branch)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/epic/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install
        working-directory: ${{ env.APP_DIR }}

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Publish this epic branch to EAS Update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          eas update --branch "$BRANCH" \
            --message "Auto-publish from $BRANCH (${GITHUB_SHA::7})" \
            --platform all \
            --environment preview \
            --non-interactive
        working-directory: ${{ env.APP_DIR }}

      - name: Summarize how to open it in Expo Go
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          {
            echo "## 📱 Open this epic in Expo Go"
            echo
            echo "Published EAS Update branch: **\`$BRANCH\`**"
            echo
            echo "In Expo Go, open the **expo-sudoku** project and pick the"
            echo "\`$BRANCH\` branch. The runtime is \`exposdk:54.0.0\`, which is"
            echo "what Expo Go runs, so it opens directly."
            echo
            echo "Branch page: https://expo.dev/accounts/mjohnson139/projects/expo-sudoku/branches/$BRANCH"
          } >> "$GITHUB_STEP_SUMMARY"

# --------------------------------------------------------------------------
# Open / update a PR -> publish a preview EAS Update and comment a QR code
  preview-mobile:
    name: EAS Update PR preview
    # Only for PRs from this repo (fork PRs can't access EXPO_TOKEN), and never
    # on `closed` -- that activity type exists for the cleanup job below, and
    # publishing here would recreate the very branch that job just deleted.
    if: >-
      github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install
        working-directory: ${{ env.APP_DIR }}

      - name: Set up EAS CLI (with token auth)
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish preview and comment on the PR
        uses: expo/expo-github-action/preview@v8
        with:
          working-directory: ${{ env.APP_DIR }}
          command: >-
            eas update
            --branch pr-${{ github.event.number }}
            --message "PR #${{ github.event.number }} preview (${{ github.event.pull_request.head.sha }})"
            --environment preview

# --------------------------------------------------------------------------
# PR closed -> delete the EAS Update branch its preview published to.
#
# EAS Update branches are a separate namespace from git: closing or merging a PR
# (and deleting its git branch) leaves `pr-<N>` published forever. Nothing prunes
# them, so they accumulate -- this repo had built up 68 stale branches, including
# duplicate pairs from an earlier workflow that published the branch's last path
# segment as well as its full ref.
#
# Safe to delete unconditionally: a `pr-<N>` branch is only ever reachable
# through the QR code in that PR's preview comment, which is dead once the PR is
# closed. It is not mapped to a channel, so no installed build resolves updates
# from it.
  cleanup-preview:
    name: Delete the PR's EAS Update branch
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up EAS CLI (with token auth)
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Delete the preview branch
        # Never fail the run over cleanup: the branch may not exist (a PR closed
        # before any preview published), and a missing branch is the desired
        # end state anyway.
        continue-on-error: true
        run: eas branch:delete "pr-${{ github.event.number }}" --non-interactive
        working-directory: ${{ env.APP_DIR }}
